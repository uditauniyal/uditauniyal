<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Udita Uniyal. Most AI sounds right. I measure whether it is." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
    .bar2 { animation-delay: .35s; }
    .val { opacity: 0; animation: fade .6s ease forwards; animation-delay: 1.5s; }
    .val2 { animation-delay: 1.85s; }
    .note { opacity: 0; animation: fade .8s ease forwards; animation-delay: 2.3s; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="56" y="84" class="sans" font-size="12.5" letter-spacing="2.6" fill="#6b7280">APPLIED AI  ·  RETRIEVAL  ·  EVALUATION</text>
  <text x="54" y="148" class="serif" font-size="56" fill="#111827">Udita Uniyal</text>
  <text x="56" y="192" class="sans" font-size="21" fill="#111827">Most AI sounds right. I measure whether it is.</text>
  <line x1="56" y1="218" x2="140" y2="218" stroke="#4338ca" stroke-width="2.5"/>
  <text x="56" y="250" class="sans" font-size="14.5" fill="#6b7280">AI Engineer, ARTPARK · IISc Bangalore</text>
  <text x="56" y="272" class="sans" font-size="14.5" fill="#6b7280">First-author paper under review at ECIR 2027</text>

  <line x1="600" y1="60" x2="600" y2="240" stroke="#e5e7eb" stroke-width="1"/>

  <text x="640" y="92" class="sans" font-size="12.5" letter-spacing="1.6" fill="#6b7280">LEGAL QUESTIONS IN PLAIN LANGUAGE</text>

  <text x="640" y="128" class="sans" font-size="14" fill="#111827">Correct law retrieved</text>
  <rect x="640" y="138" width="300" height="12" rx="6" fill="#eef0f4"/>
  <rect x="640" y="138" width="45" height="12" rx="6" fill="#4338ca" class="bar"/>
  <text x="944" y="128" class="sans val" font-size="15" font-weight="600" fill="#111827" text-anchor="end">15%</text>

  <text x="640" y="184" class="sans" font-size="14" fill="#111827">Correct law cited anyway</text>
  <rect x="640" y="194" width="300" height="12" rx="6" fill="#eef0f4"/>
  <rect x="640" y="194" width="201" height="12" rx="6" fill="#4338ca" class="bar bar2"/>
  <text x="944" y="184" class="sans val val2" font-size="15" font-weight="600" fill="#111827" text-anchor="end">67%</text>

  <text x="640" y="240" class="sans note" font-size="13" fill="#6b7280">0 of 120 answers fully grounded</text>
</svg>
